<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f4f4; }
        .app { max-width: 480px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: #fff; }
        .header { padding: 12px 16px; border-bottom: 1px solid #ddd; font-weight: 700; letter-spacing: 1px; }
        .chat { flex: 1; overflow-y: auto; padding: 16px; }
        .label { font-size: 11px; color: #777; margin-bottom: 4px; font-family: monospace; }
        .bubble { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; max-width: 90%; white-space: pre-wrap; }
        .bubble.bot { border: 1px solid #222; background: #fff; }
        .bubble.user { background: #111; color: #fff; margin-left: auto; }
        .user-label { text-align: right; }
        .chips { padding: 8px 16px; display: flex; gap: 8px; overflow-x: auto; }
        .chip { white-space: nowrap; font-size: 12px; }
        .input-area { padding: 12px 16px; border-top: 1px solid #ddd; }
        .footer-note { text-align: center; font-size: 11px; color: #777; padding-bottom: 8px; }
    </style>
</head>
<body>
    {% csrf_token %}
    <div class="app">
        <div class="header">AI ASSISTANT</div>

        <div id="chat" class="chat">
            <div class="label">CLASS ASSISTANT · Lesson helper</div>
            <div class="bubble bot">Hi! Ask me anything and I'll do my best to help.</div>
        </div>

        <div class="chips">
            <button class="btn btn-outline-dark btn-sm chip">Give me an example</button>
            <button class="btn btn-outline-dark btn-sm chip">Explain simply</button>
            <button class="btn btn-outline-dark btn-sm chip">Summarize</button>
        </div>

        <div class="input-area">
            <textarea id="prompt" class="form-control mb-2" rows="2" placeholder="Ask a question..."></textarea>
            <div class="d-flex justify-content-between">
                <button id="clearBtn" class="btn btn-outline-dark btn-sm">Clear</button>
                <button id="sendBtn" class="btn btn-dark btn-sm">Send</button>
            </div>
        </div>

        <div class="footer-note">Offline-ready PWA</div>
    </div>

    <script>
    const chat = document.getElementById("chat");
    const promptBox = document.getElementById("prompt");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;

    function addMessage(text, who) {
        const label = document.createElement("div");
        label.className = who === "user" ? "label user-label" : "label";
        label.textContent = who === "user" ? "YOU" : "CLASS ASSISTANT";

        const bubble = document.createElement("div");
        bubble.className = "bubble " + who;
        bubble.textContent = text;

        chat.appendChild(label);
        chat.appendChild(bubble);
        chat.scrollTop = chat.scrollHeight;
        return bubble;
    }

    async function sendMessage(text) {
        text = text.trim();
        if (!text) return;

        addMessage(text, "user");
        promptBox.value = "";
        sendBtn.disabled = true;
        const loading = addMessage("Thinking...", "bot");

        try {
            const res = await fetch("/ask/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrf
                },
                body: JSON.stringify({ prompt: text })
            });
            const data = await res.json();
            loading.textContent = data.reply || data.error || "No response.";
        } catch (err) {
            loading.textContent = "Couldn't reach the server.";
        }
        sendBtn.disabled = false;
    }

    sendBtn.addEventListener("click", () => sendMessage(promptBox.value));

    promptBox.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage(promptBox.value);
        }
    });

    clearBtn.addEventListener("click", () => {
        chat.innerHTML = "";
        promptBox.value = "";
    });

    document.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => {
            const last = chat.querySelectorAll(".bubble.user");
            const context = last.length ? ' about: "' + last[last.length - 1].textContent + '"' : "";
            sendMessage(chip.textContent + context);
        });
    });
</script>
</body>
</html>
