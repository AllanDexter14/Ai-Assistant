{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="{% static 'assistant/manifest.json' %}">
    <meta name="theme-color" content="#5d9b3a">
    <link rel="apple-touch-icon" href="{% static 'assistant/icons/icon-192.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body {
    background: linear-gradient(#bfe6ff 0%, #fde2ee 75%);
    background-attachment: fixed;
    font-family: "VT323", monospace;
    }
    .app {
        max-width: 480px; margin: 0 auto; height: 100vh;
        display: flex; flex-direction: column;
        background: #c6c6c6;
        border: 4px solid; border-color: #fff #555 #555 #fff;
        box-shadow: 0 0 0 4px #000;
        position: relative; z-index: 1;
    }
    .header {
        padding: 14px 16px;
        background: #5d9b3a;
        border-bottom: 6px solid #3b2a1a;
        color: #fff; font-family: "Press Start 2P", monospace; font-size: 14px;
        text-shadow: 2px 2px #2e2e2e;
    }
    .chat {
        flex: 1; overflow-y: auto; padding: 16px; margin: 8px;
        background: rgba(0,0,0,.8);
        border: 3px solid; border-color: #373737 #fff #fff #373737;
        color: #fff; font-size: 22px; line-height: 1.2;
    }
    .label {
        font-family: "Press Start 2P", monospace; font-size: 9px;
        color: #ffff55; margin-bottom: 6px;
    }
    .user-label { text-align: right; color: #55ffff; }
    .bubble {
        padding: 8px 12px; margin-bottom: 16px; max-width: 92%;
        border-radius: 0; color: #fff;
    }
    .bubble.bot { background: rgba(255,255,255,.08); border-left: 4px solid #55ff55; }
    .bubble.user {
        background: rgba(85,255,255,.15); border-right: 4px solid #55ffff;
        margin-left: auto; white-space: pre-wrap;
    }
    .bubble.bot p:last-child { margin-bottom: 0; }
    .bubble.bot strong { color: #ffaa00; }
    .bubble.bot code { background: #000; color: #55ff55; padding: 0 4px; }
    .bubble.bot pre { background: #000; padding: 8px; overflow-x: auto; }
    .chips { padding: 6px 8px; display: flex; gap: 8px; overflow-x: auto; }
    .input-area { padding: 8px; border-top: 4px solid #555; }
    .footer-note {
        text-align: center; font-family: "Press Start 2P", monospace;
        font-size: 7px; color: #373737; padding: 4px 0 10px;
    }
    .app .btn {
        border-radius: 0; font-family: "Press Start 2P", monospace; font-size: 9px;
        color: #fff; background: #8b8b8b; text-shadow: 2px 2px #3f3f3f;
        border: 3px solid; border-color: #fff #373737 #373737 #fff;
    }
    .app .btn:hover { background: #a0a0a0; color: #fff; }
    .app .btn:active { border-color: #373737 #fff #fff #373737; }
    .chip { white-space: nowrap; }
    #sendBtn { background: #3c8527; }
    #sendBtn:hover { background: #55b038; }
    #clearBtn { background: #a33a3a; }
    #clearBtn:hover { background: #c24a4a; }
    #prompt {
        background: #000; color: #fff; border-radius: 0;
        border: 3px solid; border-color: #373737 #fff #fff #373737;
        font-family: "VT323", monospace; font-size: 22px;
    }
    #prompt:focus { background: #111; color: #fff; box-shadow: none; border-color: #373737 #fff #fff #373737; }
    #prompt::placeholder { color: #888; }

    .ground {
    position: fixed; left: 0; right: 0; bottom: 0; height: 40px; z-index: 0;
    background: linear-gradient(#8fc45a 0 12px, #6b4a2f 12px);
    border-top: 4px solid #a5d86a;
}
.scene {
    position: fixed; bottom: 36px; z-index: 0; overflow: hidden;
    width: calc((100vw - 480px) / 2);
    display: flex; align-items: flex-end; justify-content: center; gap: 12px;
}
.scene-left { left: 0; }
.scene-right { right: 0; }
.scene svg { flex-shrink: 0; }
.petal {
    position: fixed; top: -20px; width: 8px; height: 8px; z-index: 0;
    background: #f7a8c4; pointer-events: none;
    animation: fall linear infinite;
}
@keyframes fall {
    to { transform: translate(70px, 105vh) rotate(200deg); }
}
@media (max-width: 900px) {
    .scene, .petal { display: none; }
}
.offline-banner {
    display: none; padding: 8px 12px; text-align: center;
    background: #a33a3a; color: #fff;
    font-family: "Press Start 2P", monospace; font-size: 8px; line-height: 1.5;
}
.offline-banner.show { display: block; }
</style>
</head>
<body>
    {% csrf_token %}
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <symbol id="tree" viewBox="0 0 64 96" shape-rendering="crispEdges">
            <rect x="28" y="48" width="8" height="48" fill="#5a3535"/>
            <rect x="24" y="64" width="4" height="4" fill="#5a3535"/>
            <rect x="36" y="56" width="4" height="4" fill="#5a3535"/>
            <rect x="8" y="24" width="48" height="24" fill="#f4a6c0"/>
            <rect x="16" y="12" width="32" height="12" fill="#f7c0d3"/>
            <rect x="20" y="0" width="24" height="12" fill="#f4a6c0"/>
            <rect x="0" y="32" width="12" height="12" fill="#e88aab"/>
            <rect x="52" y="32" width="12" height="12" fill="#e88aab"/>
            <rect x="16" y="40" width="8" height="8" fill="#e88aab"/>
            <rect x="40" y="28" width="8" height="8" fill="#fbd3e1"/>
            <rect x="28" y="16" width="8" height="8" fill="#e88aab"/>
        </symbol>
        <symbol id="house" viewBox="0 0 80 64" shape-rendering="crispEdges">
            <rect x="8" y="28" width="64" height="36" fill="#b9915a"/>
            <rect x="8" y="40" width="64" height="4" fill="#a07a48"/>
            <rect x="8" y="52" width="64" height="4" fill="#a07a48"/>
            <rect x="4" y="20" width="72" height="8" fill="#7a3b3b"/>
            <rect x="12" y="12" width="56" height="8" fill="#8a4646"/>
            <rect x="20" y="4" width="40" height="8" fill="#7a3b3b"/>
            <rect x="34" y="40" width="12" height="24" fill="#5a3a22"/>
            <rect x="42" y="52" width="2" height="2" fill="#d8b36a"/>
            <rect x="14" y="34" width="12" height="12" fill="#8fd3ff"/>
            <rect x="14" y="39" width="12" height="2" fill="#5a3a22"/>
            <rect x="19" y="34" width="2" height="12" fill="#5a3a22"/>
            <rect x="54" y="34" width="12" height="12" fill="#8fd3ff"/>
            <rect x="54" y="39" width="12" height="2" fill="#5a3a22"/>
            <rect x="59" y="34" width="2" height="12" fill="#5a3a22"/>
        </symbol>
        <symbol id="lamp" viewBox="0 0 16 48" shape-rendering="crispEdges">
            <rect x="6" y="12" width="4" height="36" fill="#4a3a2a"/>
            <rect x="4" y="0" width="8" height="12" fill="#ffd966"/>
            <rect x="6" y="2" width="4" height="8" fill="#fff3b0"/>
        </symbol>
    </defs>
</svg>

<div class="ground"></div>

<div class="scene scene-left">
    <svg width="100" height="150"><use href="#tree"/></svg>
    <svg width="150" height="120"><use href="#house"/></svg>
    <svg width="30" height="90"><use href="#lamp"/></svg>
    <svg width="70" height="105"><use href="#tree"/></svg>
</div>
<div class="scene scene-right">
    <svg width="70" height="105"><use href="#tree"/></svg>
    <svg width="30" height="90"><use href="#lamp"/></svg>
    <svg width="150" height="120"><use href="#house"/></svg>
    <svg width="100" height="150"><use href="#tree"/></svg>
</div>

<i class="petal" style="left:5%;animation-duration:9s;animation-delay:-1s"></i>
<i class="petal" style="left:12%;animation-duration:12s;animation-delay:-6s"></i>
<i class="petal" style="left:20%;animation-duration:10s;animation-delay:-3s"></i>
<i class="petal" style="left:30%;animation-duration:13s;animation-delay:-8s"></i>
<i class="petal" style="left:62%;animation-duration:11s;animation-delay:-4s"></i>
<i class="petal" style="left:72%;animation-duration:9s;animation-delay:-7s"></i>
<i class="petal" style="left:82%;animation-duration:14s;animation-delay:-2s"></i>
<i class="petal" style="left:92%;animation-duration:10s;animation-delay:-5s"></i>
    <div class="app">
        <div id="offlineBanner" class="offline-banner">⚠ You're offline. The AI can't reply until you reconnect.</div>
        <div class="header">⛏ AI ASSISTANT</div>

        <div id="chat" class="chat">
            <div class="label">CLASS ASSISTANT · Lesson helper</div>
            <div class="bubble bot">Greetings, traveler! Ask me anything and I'll help you out.</div>
        </div>

        <div class="chips">
            <button class="btn btn-outline-dark btn-sm chip">Give me an example</button>
            <button class="btn btn-outline-dark btn-sm chip">Explain simply</button>
            <button class="btn btn-outline-dark btn-sm chip">Summarize</button>
        </div>

        <div class="input-area">
            <textarea id="prompt" class="form-control mb-2" rows="2" placeholder="Ask a question..."></textarea>
            <div class="d-flex justify-content-between">
                <button id="clearBtn" class="btn btn-outline-dark btn-sm">Clear</button>
                <button id="sendBtn" class="btn btn-dark btn-sm">Send</button>
            </div>
        </div>

        <div class="footer-note">Safe Student Mode · Offline PWA</div>
    </div>

    <script>
    const chat = document.getElementById("chat");
    const promptBox = document.getElementById("prompt");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;
    let chatHistory = [];
    const greetingHTML = chat.innerHTML;
    function addMessage(text, who) {
        const label = document.createElement("div");
        label.className = who === "user" ? "label user-label" : "label";
        label.textContent = who === "user" ? "YOU" : "CLASS ASSISTANT";

        const bubble = document.createElement("div");
        bubble.className = "bubble " + who;
        bubble.textContent = text;

        chat.appendChild(label);
        chat.appendChild(bubble);
        chat.scrollTop = chat.scrollHeight;
        return bubble;
    }

    async function sendMessage(text) {
    text = text.trim();
    if (!text) return;
    if (!navigator.onLine) {
    addMessage("You're offline, so I can't reach the AI right now. Try again when you're back online.", "bot");
    return;
}

    addMessage(text, "user");
    promptBox.value = "";
    sendBtn.disabled = true;
    const loading = addMessage("Thinking...", "bot");

    try {
        const res = await fetch("/ask/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrf
            },
            body: JSON.stringify({ prompt: text, history: chatHistory })
        });
        const data = await res.json();
        if (data.reply) {
            if (typeof marked !== "undefined" && typeof DOMPurify !== "undefined") {
                loading.innerHTML = DOMPurify.sanitize(marked.parse(data.reply));
            } else {
                loading.textContent = data.reply;
            }
            chatHistory.push({ role: "user", text: text });
            chatHistory.push({ role: "model", text: data.reply });
        } else {
            loading.textContent = data.error || "No response.";
        }
    } catch (err) {
        loading.textContent = "Couldn't reach the server.";
    }
    sendBtn.disabled = false;
}

    sendBtn.addEventListener("click", () => sendMessage(promptBox.value));

    promptBox.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage(promptBox.value);
        }
    });

    clearBtn.addEventListener("click", () => {
    chat.innerHTML = greetingHTML;
    promptBox.value = "";
    chatHistory = [];
});

    document.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => {
            const last = chat.querySelectorAll(".bubble.user");
            const context = last.length ? ' about: "' + last[last.length - 1].textContent + '"' : "";
            sendMessage(chip.textContent + context);
        });
    });
    if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js", { scope: "/" });
    });
}
const offlineBanner = document.getElementById("offlineBanner");
function updateOnlineStatus() {
    offlineBanner.classList.toggle("show", !navigator.onLine);
}
window.addEventListener("online", updateOnlineStatus);
window.addEventListener("offline", updateOnlineStatus);
updateOnlineStatus();
</script>
</body>
</html>
